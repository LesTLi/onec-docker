name: Pre-build checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      onec_version:
        description: 'Версия платформы 1С'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      onec_version: ${{ steps.save_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run checks
        run: echo "Success"

      - name: Determine version
        id: save_version
        run: |
          MANUAL_VERSION="${{ github.event.inputs.onec_version }}"
          FILE_VERSION=""
          if [ -f .onec.env ]; then
            FILE_VERSION=$(grep "^ONEC_VERSION=" .onec.env | cut -d'=' -f2 | tr -d '"' | tr -d "'" | tr -d ' ')
          fi

          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="$MANUAL_VERSION"
            echo "Using manual input version: $VERSION"
          elif [ -n "$FILE_VERSION" ]; then
            VERSION="$FILE_VERSION"
            echo "Using version from .onec.env: $VERSION"
          else
            VERSION="8.3.27.2130"
            echo "Using default version: $VERSION"
          fi

          echo "Determined version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  trigger_build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      onec_version: ${{ needs.check.outputs.onec_version }}
    secrets: inherit
